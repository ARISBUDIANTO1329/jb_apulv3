{% extends "base.html" %}
{% block title %}📊 Dashboard{% endblock %}

{% block content %}
<!-- System Stats -->
<div class="stats-row stats-3">
  <div class="stat-card">
    <div class="stat-label">🖥️ CPU Usage</div>
    <div class="stat-value" id="cpu-val">-</div>
    <div class="progress"><div class="progress-bar bg-green" id="cpu-bar" style="width:0%"></div></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">💾 Memory</div>
    <div class="stat-value" id="mem-val">-</div>
    <div class="stat-sub" id="mem-sub">-</div>
    <div class="progress"><div class="progress-bar bg-green" id="mem-bar" style="width:0%"></div></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">💿 Disk</div>
    <div class="stat-value" id="disk-val">-</div>
    <div class="stat-sub" id="disk-sub">-</div>
    <div class="progress"><div class="progress-bar bg-green" id="disk-bar" style="width:0%"></div></div>
  </div>
</div>

<!-- Channel Stats -->
<div class="stats-row stats-1">
  <div class="stat-card"><div class="stat-label">Channels</div><div class="stat-value" id="s-ch">0</div></div>
</div>

<!-- Token Health Warning -->
<div id="token-warning" style="display:none" class="card mb-4" style="border-color: rgba(239,68,68,.3); background: rgba(239,68,68,.05);">
  <div class="flex items-center gap-2 text-red-400">
    <span>⚠️</span>
    <span class="font-bold">Token Google Bermasalah</span>
    <span class="text-sm text-slate-400" id="token-warning-text"></span>
  </div>
</div>

<!-- Channel Cards -->
<div id="ch-cards" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>

<script>
const COLORS = ['#2563eb','#7c3aed','#ec4899','#f43f5e','#f97316','#eab308','#059669','#0d9488','#0891b2','#4f46e5'];

async function loadStats() {
  try {
    const s = await api('/system/stats');
    document.getElementById('cpu-val').textContent = s.cpu_percent + '%';
    document.getElementById('cpu-bar').style.width = s.cpu_percent + '%';
    document.getElementById('cpu-bar').className = 'progress-bar bg-' + progressColor(s.cpu_percent);

    document.getElementById('mem-val').textContent = s.memory.percent + '%';
    document.getElementById('mem-sub').textContent = s.memory.used_mb + ' / ' + s.memory.total_mb + ' MB';
    document.getElementById('mem-bar').style.width = s.memory.percent + '%';
    document.getElementById('mem-bar').className = 'progress-bar bg-' + progressColor(s.memory.percent);

    document.getElementById('disk-val').textContent = s.disk.percent + '%';
    document.getElementById('disk-sub').textContent = s.disk.used + ' / ' + s.disk.total;
    document.getElementById('disk-bar').style.width = s.disk.percent + '%';
    document.getElementById('disk-bar').className = 'progress-bar bg-' + progressColor(s.disk.percent);
  } catch(e) {}
}

async function loadTokenHealth() {
  try {
    const r = await api('/channels/token-health');
    const el = document.getElementById('token-warning');
    const text = document.getElementById('token-warning-text');
    if (r.any_error) {
      const issues = r.channels.filter(c => c.needs_reconnect).map(c => c.channel_name + ': ' + c.message).join(', ');
      text.textContent = issues;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  } catch(e) {}
}

async function checkGoogleStatus(channelId) {
  try {
    const r = await api('/auth/google/status/' + channelId);
    const statusEl = document.getElementById('google-status-' + channelId);
    const btnEl = document.getElementById('google-btn-' + channelId);
    if (!statusEl || !btnEl) return;

    let statusIcon = '❌';
    let statusText = 'Not connected';
    let statusColor = 'text-slate-500';
    let btnText = '🔗 Connect';
    let btnClass = 'bg-blue-500 hover:bg-blue-600 text-white';

    if (r.connected && !r.is_expired) {
      statusIcon = '✅';
      statusText = 'Connected';
      statusColor = 'text-emerald-600';
      btnText = '🔄 Reconnect';
      btnClass = 'bg-slate-100 hover:bg-slate-200 text-slate-700';
      if (r.google_email) {
        statusText += ' • ' + r.google_email;
      }
    } else if (r.connected && r.is_expired) {
      statusIcon = '⚠️';
      statusText = 'Token expired';
      statusColor = 'text-amber-600';
      btnText = '🔄 Reconnect';
      btnClass = 'bg-amber-500 hover:bg-amber-600 text-white';
    }

    statusEl.innerHTML = `<span>${statusIcon}</span><span class="ml-1 ${statusColor} text-xs">${statusText}</span>`;
    btnEl.textContent = btnText;
    btnEl.className = 'px-2 py-1 rounded text-xs font-semibold transition-all ' + btnClass;
  } catch(e) {
    console.error('Failed to check Google status:', e);
  }
}

async function reconnectGoogle(channelId) {
  try {
    const r = await api('/auth/google/connect/' + channelId);
    if (r.auth_url) {
      window.open(r.auth_url, '_blank');
      setTimeout(() => checkGoogleStatus(channelId), 2000);
    } else {
      alert('Gagal membuat URL auth');
    }
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

function renderDashboard() {
  document.getElementById('s-ch').textContent = channels.length;

  const box = document.getElementById('ch-cards');
  if (!channels.length) {
    box.innerHTML = '<div class="card text-center py-12 text-slate-500"><p class="text-lg mb-2">Belum ada channel</p><p class="text-sm">Klik "+ Tambah Channel" untuk memulai</p></div>';
    return;
  }

  box.innerHTML = channels.map((ch,i) => {
    const color = COLORS[i % COLORS.length];
    const lastUpload = ch.last_upload ? new Date(ch.last_upload).toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric'}) : '-';
    const lastLive = ch.last_livestream ? new Date(ch.last_livestream).toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric'}) : '-';
    return `
      <div class="card" style="border-left: 4px solid ${color}">
        <div class="flex items-center gap-3 mb-3">
          <div style="width:40px;height:40px;border-radius:10px;background:${color}20;display:grid;place-items:center;font-weight:900;color:${color}">${ch.name.substring(0,2).toUpperCase()}</div>
          <div>
            <div class="font-bold">${ch.name}</div>
            <div class="text-xs text-slate-500">#${ch.id} • ${ch.niche || '-'}</div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2 mb-3">
          <div class="text-center p-2 rounded" style="background:rgba(255,255,255,.03)">
            <div class="text-xs text-slate-500">Subs</div>
            <div class="font-bold">${fmt(ch.subscriber_count)}</div>
          </div>
          <div class="text-center p-2 rounded" style="background:rgba(255,255,255,.03)">
            <div class="text-xs text-slate-500">Views</div>
            <div class="font-bold">${fmt(ch.total_views)}</div>
          </div>
          <div class="text-center p-2 rounded" style="background:rgba(255,255,255,.03)">
            <div class="text-xs text-slate-500">Videos</div>
            <div class="font-bold">${ch.video_count}</div>
          </div>
        </div>
        <div class="text-xs text-slate-500 mb-2">Last upload: ${lastUpload} • Last live: ${lastLive}</div>
        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
          <div id="google-status-${ch.id}" class="flex items-center">
            <span class="text-slate-400 text-xs">Loading...</span>
          </div>
          <button id="google-btn-${ch.id}" onclick="reconnectGoogle(${ch.id})" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-all">
            Connect
          </button>
        </div>
      </div>
    `;
  }).join('');

  // Check Google status for all channels
  channels.forEach(ch => {
    checkGoogleStatus(ch.id);
  });
}

function onChannelChange() {
  renderDashboard();
}

loadStats();
loadTokenHealth();
setInterval(loadStats, 30000);
setInterval(loadTokenHealth, 60000);
renderDashboard();
</script>
{% endblock %}
