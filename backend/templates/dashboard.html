{% extends "base.html" %}
{% block title %}📊 Analytics{% endblock %}

{% block content %}
<script src="https://unpkg.com/htmx.org"></script>

<div style="padding: 20px;">
  <h1>📊 Analytics - jb_apulv3</h1>

  <!-- Channels Dropdown -->
  <div style="margin: 20px 0;">
    <label>Select Channel:</label>
    <select name="channel_id"
            hx-get="/api/channels/select"
            hx-target="#channel-data"
            hx-trigger="change"
            style="padding: 8px; font-size: 14px;">
      <option value="">-- All Channels --</option>
    </select>
  </div>

  <!-- Channel Data Section -->
  <div id="channel-data">
    <div hx-get="/api/channels/list" hx-trigger="load">Loading channels...</div>
  </div>

  <!-- Performance Section -->
  <div id="performance" style="margin-top: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Video Performance</h2>
    <button hx-post="/api/youtube/snapshot" hx-target="#perf-videos">📸 Snapshot</button>
    <div id="perf-videos" style="margin-top: 20px;">
      <p>Click Snapshot to fetch video data</p>
    </div>
  </div>
</div>

<style>
  select { padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; }
  button { padding: 8px 12px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #0052a3; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  table th, table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
  table th { background: #f5f5f5; font-weight: bold; }
</style>
{% endblock %}
