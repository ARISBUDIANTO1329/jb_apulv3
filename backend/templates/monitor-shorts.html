{% extends "base.html" %}

{% block title %}📊 Monitor Shorts{% endblock %}

{% block content %}
<div x-data="monitorShortsPage()" x-init="init()">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">📊 Monitor Shorts</h1>
        <div class="flex items-center gap-3">
            <select x-model="filterStatus" @change="loadJobs()" class="form-input" style="width: auto;">
                <option value="">Semua Status</option>
                <option value="pending">Pending</option>
                <option value="generating">Generating</option>
                <option value="ready">Ready</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
            </select>
            <button @click="loadJobs()" class="btn btn-sm">🔄 Refresh</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="stat-card">
            <div class="stat-label">Total Jobs</div>
            <div class="stat-value" x-text="jobs.length"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value text-green-400" x-text="jobs.filter(j => j.status === 'completed').length"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">In Progress</div>
            <div class="stat-value text-blue-400" x-text="jobs.filter(j => ['pending','generating','ready','uploading'].includes(j.status)).length"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Failed</div>
            <div class="stat-value text-red-400" x-text="jobs.filter(j => j.status === 'failed').length"></div>
        </div>
    </div>

    <!-- Jobs List -->
    <div class="space-y-4">
        <template x-if="filteredJobs.length === 0">
            <div class="card text-center py-12 text-slate-500">
                <p class="text-lg">Tidak ada shorts job</p>
            </div>
        </template>

        <template x-for="job in filteredJobs" :key="job.id">
            <div class="card">
                <!-- Header -->
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h3 class="font-bold text-lg">
                            <span x-text="job.long_title || 'Shorts #' + job.id"></span>
                        </h3>
                        <p class="text-sm text-slate-500">
                            <span x-text="job.channel_name"></span> •
                            Created: <span x-text="formatDate(job.created_at)"></span>
                            <span x-show="job.completed_at"> • Completed: <span x-text="formatDate(job.completed_at)"></span></span>
                        </p>
                    </div>
                    <span class="badge" :class="statusBadge(job.status)" x-text="job.status.toUpperCase()"></span>
                </div>

                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span>Progress</span>
                        <span x-text="getProgress(job) + '%'"></span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" :style="`width: ${getProgress(job)}%`" :class="progressColor(job.status)"></div>
                    </div>
                </div>

                <!-- Long Video -->
                <div class="mb-4 p-3 rounded-lg" style="background: rgba(255,255,255,.03);">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-xs text-slate-500 mb-1">Video Long</div>
                            <a :href="job.long_youtube_url" target="_blank" class="text-blue-400 text-sm" x-text="job.long_youtube_url"></a>
                        </div>
                        <span class="badge badge-success">✅ Uploaded</span>
                    </div>
                </div>

                <!-- Shorts Timeline -->
                <div class="space-y-2">
                    <div class="text-xs text-slate-500 font-bold uppercase mb-2">Shorts</div>
                    <template x-for="item in job.items" :key="item.id">
                        <div class="flex items-center gap-4 p-3 rounded-lg" style="background: rgba(255,255,255,.02);">
                            <!-- Number -->
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
                                :class="item.status === 'uploaded' ? 'bg-green-500/20 text-green-400' : item.status === 'failed' ? 'bg-red-500/20 text-red-400' : 'bg-slate-500/20 text-slate-400'">
                                <span x-text="item.short_number"></span>
                            </div>

                            <!-- Info -->
                            <div class="flex-1">
                                <p class="text-sm font-medium" x-text="item.title"></p>
                                <p class="text-xs text-slate-500">
                                    <span x-show="item.upload_time">Upload: <span x-text="item.upload_time"></span> WIB</span>
                                    <span x-show="item.start_second !== null"> • Segment: <span x-text="item.start_second + 's - ' + item.end_second + 's'"></span></span>
                                    <span x-show="item.youtube_id"> • <a :href="'https://youtube.com/watch?v=' + item.youtube_id" target="_blank" class="text-blue-400">📺 YouTube</a></span>
                                </p>
                            </div>

                            <!-- Status -->
                            <div class="flex items-center gap-2">
                                <span class="badge" :class="statusBadge(item.status)" x-text="item.status"></span>
                                <span x-show="item.uploaded_at" class="text-xs text-slate-500" x-text="formatTime(item.uploaded_at)"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Error -->
                <template x-if="job.error_message">
                    <div class="mt-3 p-3 rounded-lg text-sm text-red-400" style="background: rgba(239,68,68,.05);">
                        ⚠️ <span x-text="job.error_message"></span>
                    </div>
                </template>

                <!-- Actions -->
                <div class="flex justify-end gap-2 mt-4">
                    <button x-show="job.status === 'failed'" @click="retryJob(job.id)" class="btn btn-sm">🔄 Retry</button>
                    <button @click="deleteJob(job.id)" class="btn btn-sm btn-danger">🗑️ Delete</button>
                </div>
            </div>
        </template>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function monitorShortsPage() {
    return {
        jobs: [],
        filterStatus: '',

        async init() {
            await this.loadJobs();
            // Auto-refresh every 10 seconds
            setInterval(() => this.loadJobs(), 10000);
        },

        async loadJobs() {
            try {
                const r = await fetch('/api/shorts');
                this.jobs = await r.json();
            } catch (e) {
                console.error('Failed to load jobs:', e);
            }
        },

        get filteredJobs() {
            if (!this.filterStatus) return this.jobs;
            return this.jobs.filter(j => j.status === this.filterStatus);
        },

        getProgress(job) {
            if (!job.items || job.items.length === 0) return 0;
            const done = job.items.filter(i => ['uploaded', 'completed'].includes(i.status)).length;
            return Math.round((done / job.items.length) * 100);
        },

        async retryJob(jobId) {
            try {
                const r = await fetch(`/api/shorts/${jobId}/retry`, { method: 'POST' });
                const data = await r.json();
                if (data.success) {
                    alert(`✅ ${data.retry_count} item(s) di-retry`);
                    await this.loadJobs();
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        },

        async deleteJob(jobId) {
            if (!confirm('Hapus shorts job ini?')) return;
            try {
                await fetch(`/api/shorts/${jobId}`, { method: 'DELETE' });
                await this.loadJobs();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        },

        formatDate(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleDateString('id-ID', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        },

        formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('id-ID', {
                hour: '2-digit', minute: '2-digit'
            });
        },

        statusBadge(status) {
            const map = {
                'created': 'badge-warning',
                'pending': 'badge-warning',
                'generating': 'badge-info',
                'ready': 'badge-info',
                'uploading': 'badge-info',
                'uploaded': 'badge-success',
                'completed': 'badge-success',
                'failed': 'badge-danger',
            };
            return map[status] || 'badge-default';
        },

        progressColor(status) {
            if (status === 'completed') return 'bg-green-500';
            if (status === 'failed') return 'bg-red-500';
            return 'bg-blue-500';
        },
    };
}
</script>
{% endblock %}
